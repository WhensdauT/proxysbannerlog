<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        const MAINTENANCE = false;
        if (MAINTENANCE) window.location.href = 'maintenance.html';
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy's Banner Log | Баннеры ZZZ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="particles.css">
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Обложка -->
    <div class="cover">
        <div class="cover-overlay"></div>
        <h1 class="neon-title">Proxy's Banner Log</h1>
        <p class="subtitle-small">Автоматический счётчик дней с последнего баннера каждого персонажа</p>
    </div>

    <!-- Таймер -->
    <div class="timer-section" id="timer-section">
        <p class="timer-label">До следующего баннера</p>
        <div class="timer" id="countdown">
            <span id="days">0</span>д
            <span id="hours">0</span>ч
            <span id="minutes">0</span>м
        </div>
    </div>

    <!-- Фильтры -->
    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="Дебют">Дебют</button>
        <button class="filter-btn" data-filter="Реран">Реран</button>
    </div>

    <!-- Поиск и сортировка -->
    <div class="controls">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Введите имя персонажа..." class="search-input">
        </div>
        <div class="sort-container">
            <select id="sort-select" class="sort-select">
                <option value="newest">По новизне</option>
                <option value="days">По дням без рерана</option>
                <option value="name">По имени (А-Я)</option>
            </select>
        </div>
    </div>

    <!-- Сетка карточек -->
    <div class="container" id="banner-container"></div>

    <!-- Кнопка "Наверх" -->
    <button id="scroll-top" class="scroll-top" title="Наверх">▲</button>

    <footer>
        <p>Данные обновляются автоматически • Неофициальный фанатский проект</p>
        <p>Сайт создан <a href="https://github.com/WhensdauT" target="_blank">WhensdauT</a> • <a href="about.html">О проекте</a></p>
    </footer>

    <script src="particles.js"></script>
    <script src="script.js"></script>
</body>
</html>
